<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>2D Physics Engine</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        #canvas-container { position: relative; width: 100vw; height: 100vh; }
        canvas { position: absolute; top: 0; left: 0; }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="static-canvas" style="background-color: skyblue;"></canvas>
        <canvas id="dynamic-canvas"></canvas>
    </div>

    <!-- type="module" подключает точку входа js/main.js -->
    <script type="module" src="./js/main.js"></script>
</body>
</html>
